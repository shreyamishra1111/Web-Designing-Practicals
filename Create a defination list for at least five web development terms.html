        <h1>Defination List of Web Development terms</h1>
        <dl>
            <dt>HTML</dt>
            <dd>Used to create and structure web page</dd>

            <dt>CSS</dt>
            <dd>Used to style and design a web page</dd>

            <dt>Javascript</dt>
            <dd>Used to make web page interactive</dd>

            <dt>frontend</dt>
            <dd>A part of website which users see and interact with</dd>

            <dt>Backend</dt>
            <dd>The server side part of website</dd>
        </dl>
