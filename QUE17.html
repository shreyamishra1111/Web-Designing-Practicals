
<!DOCTYPE html>
<html>
<head>
    <title>Rowspan and Colspan</title>
</head>
<body>

    <h1>Student Marks Table</h1>

    <table border="1">
        <tr>
            <th rowspan="2">Name</th>
            <th colspan="2">Marks</th>
        </tr>

        <tr>
            <th>Maths</th>
            <th>Science</th>
        </tr>

        <tr>
            <td>Ansh</td>
            <td>90</td>
            <td>85</td>
        </tr>

        <tr>
            <td>Aarush</td>
            <td>94</td>
            <td>88</td>
        </tr>

        <tr>
            <td>Shivam</td>
            <td>97</td>
            <td>92</td>
        </tr>
    </table>

</body>
</html>
